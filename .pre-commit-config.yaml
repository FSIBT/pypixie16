repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
    - id: trailing-whitespace
    - id: check-toml
    - id: check-yaml
    - id: check-json
    - id: check-merge-conflict
    - id: debug-statements
-   repo: https://github.com/asottile/pyupgrade
    rev: v3.3.1
    hooks:
    - id: pyupgrade
      args: [--py38-plus]
-   repo: https://github.com/psf/black
    rev: 23.1.0
    hooks:
    - id: black
