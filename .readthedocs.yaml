# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

formats: all

sphinx:
   builder: html
   configuration: docs/source/conf.py

build:
  os: ubuntu-22.04
  apt_packages:
    - qmake6
  tools:
    python: "3.11"

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
