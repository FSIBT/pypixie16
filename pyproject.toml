[build-system]
requires = ["setuptools>=61.0", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "pypixie16"
dynamic = ["version"]
authors = [
   { name = "Arun Persaud", email = "apersaud@lbl.gov" },
   { name = "Ariel Amsellem", email = "ajamsellem@lbl.gov" },
   { name = "Andrew Rosenstrom", email = "arosenstrom@lbl.gov" },
   { name = "Brian Mak", email = "brianmak@lbl.gov" },
   { name = "Mauricio Ayllon Unzueta", email = "mayllonu@lbl.gov" },
   { name = "Will Larsen", email = "wlarsen@lbl.gov" },
   { name = "Caroline Egan", email ="cegan@lbl.gov" },
]
readme = "README.md"
license = {file = "LICENSE.txt"}
requires-python = ">=3.10"
dependencies = [
    "appdirs",
    "bitstruct",
    "docopt",
    "fast-histogram",
    "matplotlib",
    "msgspec",
    "more_itertools",
    "numba",
    "numpy",
    "pandas",
    "pint",
    "platformdirs",
    "psutil",
    "PyQt6",
    "pyqtgraph",
    "pyzmq",
    "rich",
    "setuptools",
    "setuptools_scm",
    "tables",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: BSD License",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
fast = ["cbitstruct"]
test = ["pytest", "pytest-cov"]
docs = [
    "alabaster",
    "markupsafe",
    "sphinx",
    "sphinxcontrib-napoleon",
    "myst-parser",
]

[project.urls]
documentation = "https://pypixie16.readthedocs.io/en/latest/"
homepage = "https://bitbucket.org/berkeleylab/pypixie16"
issues = "https://bitbucket.org/berkeleylab/pypixie16/issues"
changelog = "https://bitbucket.org/berkeleylab/pypixie16/src/main/CHANGELOG.md"

[project.scripts]
pixie16-parameter-scan = "pixie16.cli.parameter_scan:main"
pixie16-binary-browser = "pixie16.cli.binary_browser:main"
pixie16-coincidence = "pixie16.cli.coincidence:main"
pixie16-scope = "pixie16.cli.scope:main"
pixie16-daq = "pixie16.cli.pixie_daq:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pixie16" = ["py.typed", "*.json", "*.bin"]

[tool.setuptools_scm]
write_to = "src/pixie16/_version.py"

[tool.coverage.run]
branch = true
source = ["src/pixie16", "tests"]

[tool.coverage.report]
skip_covered = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
ignore = ["E741"]
select = ["UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = 80

