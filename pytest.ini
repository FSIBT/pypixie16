[pytest]
# Pytest configuration for PIXIE-16 Scope integration tests

# Minimum pytest version
minversion = 6.0

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Add current directory to Python path
pythonpath = . src

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes
    -ra

# Test coverage options (uncomment to enable)
# addopts = 
#     --cov=pixie16.ui.scope
#     --cov-report=html
#     --cov-report=term-missing
#     --cov-branch

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    hardware: marks tests requiring actual PIXIE-16 hardware
    integration: marks integration tests
    unit: marks unit tests
    performance: marks performance/benchmark tests

# Test timeouts (requires pytest-timeout)
# timeout = 300
# timeout_method = thread

# Parallel execution (requires pytest-xdist)
# addopts = -n auto

# Ignore patterns
norecursedirs = .git .tox dist build *.egg __pycache__ .pytest_cache

# Doctest options
doctest_optionflags = NORMALIZE_WHITESPACE ELLIPSIS

# Warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning