name: Docs

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # setuptools_scm needs the tags
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Qt system libraries
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libxkbcommon0 libegl1 libglx-mesa0 libglib2.0-0 libdbus-1-3 libpulse0
      - run: python -m pip install -U pip
      - run: python -m pip install ".[docs]"
      - run: python -m sphinx -b html docs/source docs/_build/html
      - uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: docs/_build/html
