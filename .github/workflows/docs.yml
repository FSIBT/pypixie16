name: Docs

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # setuptools_scm needs the tags
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install Qt system libraries
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libxkbcommon0 libegl1 libglx-mesa0 libglib2.0-0 libdbus-1-3 libpulse0
      - run: uv sync --locked --extra docs
      - run: uv run --no-sync python -m sphinx -b html docs/source docs/_build/html
      - uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: docs/_build/html
